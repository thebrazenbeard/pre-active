[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-active"
version = "0.1.0"
description = "Continuous resident runtime for self-initiating language models with user-defined local model targets"
requires-python = ">=3.11"
authors = [{name = "Patrick Sims"}]
license = {text = "Source-available proprietary; see LICENSE"}
readme = "README.md"

[project.optional-dependencies]
volition = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@e728c04ce2405854f8a2f9e62c819a32670e89ef",
]
meso = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@e728c04ce2405854f8a2f9e62c819a32670e89ef",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@4ed527d31a68fc215158a520f1cd404e8f16b35b",
]
dev = [
    "pytest>=8,<10",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@4ed527d31a68fc215158a520f1cd404e8f16b35b",
    "volition @ git+https://github.com/thebrazenbeard/volition.git@e728c04ce2405854f8a2f9e62c819a32670e89ef",
]

[project.scripts]
pre-active = "pre_active.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
