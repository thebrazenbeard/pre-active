[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-active"
version = "0.1.0"
description = "Continuous resident runtime for self-initiating language models with user-defined local model targets"
requires-python = ">=3.11"
authors = [{name = "Patrick Sims"}]
license = {text = "Source-available proprietary; see LICENSE"}
readme = "README.md"

[project.optional-dependencies]
volition = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@f622e564bf257b0ffc0b3c05130b62db1c201d3d",
]
meso = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@f622e564bf257b0ffc0b3c05130b62db1c201d3d",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@86c15a633daafd27cb4c3273e228f786dd54dc41",
]
dev = [
    "pytest>=8,<10",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@86c15a633daafd27cb4c3273e228f786dd54dc41",
    "volition @ git+https://github.com/thebrazenbeard/volition.git@f622e564bf257b0ffc0b3c05130b62db1c201d3d",
]

[project.scripts]
pre-active = "pre_active.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
