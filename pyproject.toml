[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-active"
version = "0.1.0"
description = "Continuous resident runtime for self-initiating language models with user-defined local model targets"
requires-python = ">=3.11"
authors = [{name = "Patrick Sims"}]
license = {text = "Source-available proprietary; see LICENSE"}
readme = "README.md"

[project.optional-dependencies]
volition = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@534907c3d88a941a194e1888abc1c11402a3df22",
]
meso = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@534907c3d88a941a194e1888abc1c11402a3df22",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@e35e39fc2e3608265871b3197ea6098a0f13299b",
]
dev = [
    "pytest>=8,<10",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@e35e39fc2e3608265871b3197ea6098a0f13299b",
    "volition @ git+https://github.com/thebrazenbeard/volition.git@534907c3d88a941a194e1888abc1c11402a3df22",
]

[project.scripts]
pre-active = "pre_active.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
