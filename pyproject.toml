[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-active"
version = "0.1.0"
description = "Continuous resident runtime for self-initiating language models with user-defined local model targets"
requires-python = ">=3.11"
authors = [{name = "Patrick Sims"}]
license = {text = "Source-available proprietary; see LICENSE"}
readme = "README.md"

[project.optional-dependencies]
volition = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@53570902890852845599df9b997bad5fa68ac2f3",
]
meso = [
    "volition @ git+https://github.com/thebrazenbeard/volition.git@53570902890852845599df9b997bad5fa68ac2f3",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@14bd3f6a359fc267a5246ccfc1682cb4c0c1b2e4",
]
dev = [
    "pytest>=8,<10",
    "meso-crct @ git+https://github.com/thebrazenbeard/meso-crct.git@14bd3f6a359fc267a5246ccfc1682cb4c0c1b2e4",
    "volition @ git+https://github.com/thebrazenbeard/volition.git@53570902890852845599df9b997bad5fa68ac2f3",
]

[project.scripts]
pre-active = "pre_active.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
