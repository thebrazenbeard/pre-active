name: Workspace Startup Safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor-autostart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject concealed folder-open execution
        run: python3 -m unittest discover -s tests -p test_workspace_startup_safety.py -v
